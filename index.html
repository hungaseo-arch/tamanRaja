<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- 브라우저 UI(안드로이드 주소창 등) 색. manifest(vite.config.ts)의
         theme_color 와 같아야 한다 — 다르면 설치 앱과 브라우저에서 주소창 색이
         달라진다. 밝은 화면만 쓰므로 prefers-color-scheme 로 나누지 않는다. -->
    <meta name="theme-color" content="#1f8a3b" />
    <!-- OS 가 어둡더라도 폼 컨트롤·스크롤바까지 밝게 그리게 한다. 이걸 빼면
         입력창과 셀렉트만 검게 나와 화면이 반쯤 어두워진 것처럼 보인다. -->
    <meta name="color-scheme" content="light" />

    <!-- 회원 전용 사이트라 검색에 올리지 않는다. robots.txt 와 함께 둔다 —
         robots.txt 는 크롤링만 막고, 다른 곳에 걸린 링크로 들어온 색인은 이 메타가 막는다. -->
    <meta name="robots" content="noindex, nofollow" />
    <!-- CSP. GitHub Pages 는 응답 헤더를 못 바꾸므로 메타로 건다. frame-ancestors 는
         메타에서 무시되므로 넣지 않는다. 빌드 결과에 인라인 스크립트가 생기면 여기서
         막히니 dist/index.html 을 확인할 것. Supabase 주소가 바뀌면 connect-src 도 고친다. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://kixozxisuxcajsbldjul.supabase.co; base-uri 'self'; form-action 'self'"
    />

    <title>따만라자 모임</title>
    <meta name="description" content="따만라자 골프모임 대시보드" />
    <meta name="author" content="따만라자" />

    <!-- 아래 자리표시자는 vite 가 base('/tamanRaja/')로 치환한다. 경로를 직접
         적으면 나중에 배포 경로가 바뀔 때 아이콘만 조용히 404 가 된다. -->
    <link rel="icon" type="image/svg+xml" href="/tamanRaja/favicon.svg" />
    <!-- SVG 파비콘을 못 읽는 브라우저용 대체 -->
    <link rel="icon" type="image/png" sizes="96x96" href="/tamanRaja/favicon-96.png" />
    <!-- iOS 홈 화면. sizes 를 붙이지 않으면 기기별로 흐리게 늘어난다. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/tamanRaja/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="따만라자" />

    <!-- 공유 카드. og:image 는 반드시 절대 URL 이어야 한다 — 카카오톡·트위터
         크롤러는 페이지를 우리 도메인 밖에서 읽으므로 상대경로를 못 푼다. -->
    <meta property="og:title" content="따만라자 골프모임" />
    <meta property="og:description" content="월간 기록 · 연간 랭킹 · 핸디캡 관리" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hungaseo-arch.github.io/tamanRaja/" />
    <meta property="og:site_name" content="따만라자 모임" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:image" content="https://hungaseo-arch.github.io/tamanRaja/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="따만라자 모임 — 월간 기록, 연간 랭킹, 핸디캡 관리" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="따만라자 골프모임" />
    <meta name="twitter:description" content="월간 기록 · 연간 랭킹 · 핸디캡 관리" />
    <meta name="twitter:image" content="https://hungaseo-arch.github.io/tamanRaja/og-image.png" />
    <script type="module" crossorigin src="/tamanRaja/assets/index-DwNEgFo3.js"></script>
    <link rel="stylesheet" crossorigin href="/tamanRaja/assets/index-DqLNcVLw.css">
  <link rel="manifest" href="/tamanRaja/manifest.webmanifest"></head>
  <body>
    <div id="app"></div>
  </body>
</html>
