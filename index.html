<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- 브라우저 UI(안드로이드 주소창 등) 색. media 로 나누지 않고 하나만 두고
         아래 스크립트와 useTheme 이 값을 갈아끼운다 — OS 는 밝은데 앱만 어둡게
         쓰는 경우에도 주소창이 따라오게 하려면 media 쿼리로는 안 된다.
         반드시 스크립트보다 위에 있어야 한다. 아래에 두면 스크립트가 돌 때
         아직 이 태그가 없어서 첫 화면의 주소창만 흰색으로 남는다. -->
    <meta name="theme-color" content="#ffffff" />

    <!-- 테마를 그리기 전에 적용한다. 스크립트가 아래에 있으면 첫 프레임이 밝은
         화면으로 한 번 번쩍인 뒤 어두워진다. defer/모듈이 아닌 이유도 같다. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('taman:theme');
          var dark = saved === 'dark' ||
            (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0b1410' : '#ffffff');
        } catch (e) { /* 저장소를 못 쓰면 밝은 화면으로 둔다 */ }
      })();
    </script>

    <title>따만라자 모임</title>
    <meta name="description" content="따만라자 골프모임 대시보드" />
    <meta name="author" content="따만라자" />

    <!-- 아래 자리표시자는 vite 가 base('/tamanRaja/')로 치환한다. 경로를 직접
         적으면 나중에 배포 경로가 바뀔 때 아이콘만 조용히 404 가 된다. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <!-- SVG 파비콘을 못 읽는 브라우저용 대체 -->
    <link rel="icon" type="image/png" sizes="96x96" href="%BASE_URL%favicon-96.png" />
    <!-- iOS 홈 화면. sizes 를 붙이지 않으면 기기별로 흐리게 늘어난다. -->
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="따만라자" />

    <!-- 공유 카드. og:image 는 반드시 절대 URL 이어야 한다 — 카카오톡·트위터
         크롤러는 페이지를 우리 도메인 밖에서 읽으므로 상대경로를 못 푼다. -->
    <meta property="og:title" content="따만라자 골프모임" />
    <meta property="og:description" content="월간 기록 · 연간 랭킹 · 핸디캡 관리" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hungaseo-arch.github.io/tamanRaja/" />
    <meta property="og:site_name" content="따만라자 모임" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:image" content="https://hungaseo-arch.github.io/tamanRaja/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="따만라자 모임 — 월간 기록, 연간 랭킹, 핸디캡 관리" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="따만라자 골프모임" />
    <meta name="twitter:description" content="월간 기록 · 연간 랭킹 · 핸디캡 관리" />
    <meta name="twitter:image" content="https://hungaseo-arch.github.io/tamanRaja/og-image.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
